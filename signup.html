<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title id="spPageTitle">活动报名</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<link rel="stylesheet" href="signup.css?v=20261015a">
</head>
<body>
<div class="sp-shell">
  <div class="sp-topbar" id="spTopbar">
    <button class="sp-icon-btn" id="spBackBtn" onclick="spGoBack()"><i class="ti ti-chevron-left"></i></button>
    <div class="sp-topbar-title" id="spTopbarTitle"></div>
    <div class="sp-topbar-right">
      <button class="sp-icon-btn" id="spAdminBtn" onclick="spAdminFabClick()" title="管理"><i class="ti ti-shield-lock"></i></button>
      <button class="sp-icon-btn" id="spShareBtn" aria-label="分享" onclick="spShare()"><i class="ti ti-share-2"></i></button>
    </div>
  </div>
  <div class="sp-body" id="spBody"></div>
</div>

<!-- 管理员登录 -->
<div class="sp-overlay center" id="spLoginOverlay" onclick="spCloseOverlay(event,'spLoginOverlay')">
  <div class="sp-sheet" onclick="event.stopPropagation()">
    <button class="sp-sheet-close" onclick="spCloseOverlay(null,'spLoginOverlay')"><i class="ti ti-x"></i></button>
    <div class="sp-sheet-title">管理员登录</div>
    <div style="font-size:12px;color:var(--text-3);margin-bottom:14px">与排班表后台使用同一个管理员账号</div>
    <div class="sp-form-row"><label>用户名</label><input type="text" id="spLoginUser" autocomplete="off"></div>
    <div class="sp-form-row"><label>密码</label><input type="password" id="spLoginPass" onkeydown="if(event.key==='Enter')spDoLogin()"></div>
    <div class="sp-login-err" id="spLoginErr">用户名或密码错误</div>
    <button class="sp-btn sp-btn-primary sp-btn-block" style="margin-top:12px" onclick="spDoLogin()">登录</button>
  </div>
</div>

<!-- 报名活动管理（列表） -->
<div class="sp-overlay" id="spManagerOverlay" onclick="spCloseOverlay(event,'spManagerOverlay')">
  <div class="sp-sheet" onclick="event.stopPropagation()">
    <button class="sp-sheet-close" onclick="spCloseOverlay(null,'spManagerOverlay')"><i class="ti ti-x"></i></button>
    <div class="sp-sheet-handle"></div>
    <div class="sp-sheet-title">报名活动管理</div>
    <div style="font-size:12px;color:var(--text-3);margin-bottom:14px">开启的活动所有访客打开本页都能看到；可自由增减报名要收集的信息字段</div>
    <button class="sp-btn sp-btn-primary sp-btn-block" style="margin-bottom:14px" onclick="spOpenEditor(null)"><i class="ti ti-plus" style="margin-right:4px"></i>新建报名活动</button>
    <div id="spManagerList"></div>
    <button class="sp-btn sp-btn-ghost sp-btn-block" style="margin-top:6px" onclick="spLogout()">退出管理</button>
  </div>
</div>

<!-- 活动编辑器 -->
<div class="sp-overlay" id="spEditorOverlay" onclick="spCloseOverlay(event,'spEditorOverlay')" style="z-index:510">
  <div class="sp-sheet" onclick="event.stopPropagation()">
    <button class="sp-sheet-close" onclick="spCloseOverlay(null,'spEditorOverlay')"><i class="ti ti-x"></i></button>
    <div class="sp-sheet-handle"></div>
    <div class="sp-sheet-title" id="spEditorTitle">新建报名活动</div>

    <div style="display:flex;align-items:center;gap:12px;margin:14px 0">
      <img id="spEditorCoverPreview" src="" style="width:72px;height:72px;border-radius:12px;object-fit:cover;background:var(--bg-subtle);display:none;flex-shrink:0">
      <div style="flex:1;min-width:0">
        <label class="sp-btn sp-btn-ghost" style="display:inline-flex;align-items:center;gap:6px;cursor:pointer">
          <i class="ti ti-upload" style="font-size:14px"></i>上传封面图
          <input type="file" accept="image/*" style="display:none" onchange="spUploadCover(this)">
        </label>
        <button class="sp-btn sp-btn-ghost" style="margin-left:6px" onclick="spRemoveCover()">移除</button>
      </div>
    </div>

    <div class="sp-row-2">
      <div class="sp-form-row"><label>分类标签</label><input type="text" id="spfTag" placeholder="如：聚会" maxlength="10"></div>
      <div class="sp-form-row"><label>启用</label>
        <label class="sp-switch" style="margin-top:6px"><input type="checkbox" id="spfEnabled"><span class="track"></span><span class="thumb"></span></label>
      </div>
    </div>
    <div class="sp-form-row"><label>活动标题</label><input type="text" id="spfTitle" placeholder="如：教会主日聚会" maxlength="40"></div>
    <div class="sp-row-2">
      <div class="sp-form-row"><label>日期</label><input type="date" id="spfDate"></div>
      <div class="sp-form-row"><label></label>
        <div class="sp-row-2">
          <input type="time" id="spfTimeStart">
          <input type="time" id="spfTimeEnd">
        </div>
      </div>
    </div>
    <div class="sp-row-2">
      <div class="sp-form-row"><label>地点</label><input type="text" id="spfLocation" placeholder="如：教会主堂"></div>
      <div class="sp-form-row"><label>详细地址（选填）</label><input type="text" id="spfAddress" placeholder="如：Rua da Paz, 123"></div>
    </div>
    <div class="sp-form-row"><label>简介标题（选填，如：欢迎参加）</label><input type="text" id="spfIntroTitle" placeholder="填写后会显示为带图标的小标题" maxlength="20"></div>
    <div class="sp-form-row"><label>简介</label><textarea id="spfIntro" placeholder="欢迎你来到教会…"></textarea></div>
    <div class="sp-form-row"><label>亮点标签（用逗号分隔）</label><input type="text" id="spfHighlights" placeholder="如：敬拜赞美,圣经讲道,团契相交"></div>
    <div class="sp-form-row"><label>详情标题</label><input type="text" id="spfDetailTitle" placeholder="活动详情"></div>
    <div class="sp-form-row"><label>详情内容</label><textarea id="spfDetail" placeholder="本次聚会将有…" style="min-height:90px"></textarea></div>
    <div class="sp-row-2">
      <div class="sp-form-row"><label>详情页按钮文字</label><input type="text" id="spfCtaText" placeholder="立即报名"></div>
      <div class="sp-form-row"><label>表单提交按钮文字</label><input type="text" id="spfSubmitText" placeholder="提交报名"></div>
    </div>

    <hr class="sp-divider">
    <div class="sp-sheet-title" style="font-size:14.5px;margin:0 0 10px"><i class="ti ti-ticket" style="color:var(--primary);margin-right:5px"></i>名额与截止时间</div>
    <div class="sp-row-2">
      <div class="sp-form-row"><label>人数上限（0 = 不限）</label><input type="number" id="spfCapacity" min="0" inputmode="numeric" placeholder="0"></div>
      <div class="sp-form-row"><label>名额计算方式</label>
        <select id="spfCapacityMode"><option value="count">按报名份数</option><option value="people">按总人数（累加“人数”字段）</option></select>
      </div>
    </div>
    <div class="sp-row-2">
      <div class="sp-form-row"><label>报名截止时间（选填）</label><input type="datetime-local" id="spfDeadline"></div>
      <div class="sp-form-row"><label>向访客显示剩余名额</label>
        <label class="sp-switch" style="margin-top:6px"><input type="checkbox" id="spfShowRemaining"><span class="track"></span><span class="thumb"></span></label>
      </div>
    </div>

    <hr class="sp-divider">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
      <div class="sp-sheet-title" style="font-size:14.5px;margin:0">报名信息收集字段</div>
      <button class="sp-btn sp-btn-ghost" onclick="spAddField()"><i class="ti ti-plus" style="font-size:13px;margin-right:3px"></i>添加字段</button>
    </div>
    <div id="spFieldEditorList"></div>

    <div style="display:flex;gap:8px;margin-top:16px">
      <button class="sp-btn sp-btn-ghost" style="flex:1" onclick="spCloseOverlay(null,'spEditorOverlay')">取消</button>
      <button class="sp-btn sp-btn-primary" style="flex:1" onclick="spSaveEvent()">保存</button>
    </div>
  </div>
</div>

<!-- 报名数据查看 -->
<div class="sp-overlay" id="spSubsOverlay" onclick="spCloseOverlay(event,'spSubsOverlay')" style="z-index:510">
  <div class="sp-sheet sp-subs-sheet" onclick="event.stopPropagation()">
    <button class="sp-sheet-close" onclick="spCloseOverlay(null,'spSubsOverlay')"><i class="ti ti-x"></i></button>
    <div class="sp-sheet-handle"></div>
    <div class="sp-subs-head">
      <div class="sp-subs-head-icon"><i class="ti ti-users-group"></i></div>
      <div style="min-width:0">
        <div class="sp-sheet-title" id="spSubsTitle">报名数据</div>
        <div class="sp-subs-sub" id="spSubsSub"></div>
      </div>
    </div>

    <div class="sp-schema-warn" id="spSchemaWarn"></div>
    <div class="sp-stats" id="spSubsStats"></div>

    <div class="sp-subs-bar2">
      <div class="sp-seg" id="spSubsTabs">
        <button class="active" data-tab="list" onclick="spSwitchSubsTab('list')"><i class="ti ti-list-details"></i>列表</button>
        <button data-tab="chart" onclick="spSwitchSubsTab('chart')"><i class="ti ti-chart-bar"></i>图表</button>
      </div>
      <div class="sp-bar2-right">
        <button class="sp-chip-btn" id="spSelectModeBtn" onclick="spToggleSelectMode()"><i class="ti ti-checkbox"></i><span>批量</span></button>
        <div class="sp-menu-wrap">
          <button class="sp-chip-btn primary" onclick="spToggleExportMenu(event)"><i class="ti ti-download"></i><span>导出</span><i class="ti ti-chevron-down" style="font-size:12px"></i></button>
          <div class="sp-menu" id="spExportMenu" onclick="event.stopPropagation()">
            <div class="sp-menu-scope" id="spExportScope"></div>
            <button onclick="spExportSubsXLSX()"><i class="ti ti-file-spreadsheet" style="color:#1D7A46"></i>导出 Excel (.xlsx)</button>
            <button onclick="spExportSubsCSV()"><i class="ti ti-file-type-csv" style="color:#5c5c54"></i>导出 CSV</button>
            <button onclick="spPrintSignSheet()"><i class="ti ti-printer" style="color:#4C8DF6"></i>打印签到表 / 存为 PDF</button>
          </div>
        </div>
      </div>
    </div>

    <div class="sp-list-tools" id="spSubsListTools">
      <div class="sp-subs-toolbar">
        <div class="sp-search">
          <i class="ti ti-search"></i>
          <input type="text" id="spSubsSearch" placeholder="搜索姓名、电话、备注…" oninput="spOnFilterChange()">
          <button class="sp-search-clear" id="spSubsSearchClear" onclick="spClearSubsSearch()"><i class="ti ti-x"></i></button>
        </div>
        <button class="sp-tool-btn" title="切换排序" aria-label="切换排序" id="spSubsSortBtn" onclick="spToggleSubsSort()"><i class="ti ti-sort-descending"></i></button>
        <button class="sp-tool-btn" title="刷新" aria-label="刷新" onclick="spLoadSubmissions()"><i class="ti ti-refresh"></i></button>
      </div>
      <div class="sp-chips" id="spSubsChips"></div>
      <div class="sp-date-row">
        <i class="ti ti-calendar-event"></i>
        <input type="date" id="spSubsFrom" onchange="spOnFilterChange()" aria-label="开始日期">
        <span>至</span>
        <input type="date" id="spSubsTo" onchange="spOnFilterChange()" aria-label="结束日期">
        <button class="sp-date-quick" onclick="spQuickRange(1)">今天</button>
        <button class="sp-date-quick" onclick="spQuickRange(7)">近7天</button>
        <button class="sp-date-quick" id="spDateClear" onclick="spClearDates()" style="display:none">清除</button>
      </div>
    </div>

    <div class="sp-batch-bar" id="spBatchBar">
      <label class="sp-batch-all"><input type="checkbox" id="spSelectAll" onchange="spSelectAllToggle(this.checked)"><span>全选</span></label>
      <span class="sp-batch-count" id="spBatchCount">已选 0 条</span>
      <select id="spBatchStatus" onchange="spBatchSetStatus(this.value)" aria-label="批量设置状态">
        <option value="">设为…</option>
        <option value="pending">待确认</option>
        <option value="confirmed">已确认</option>
        <option value="checked_in">已到场</option>
        <option value="cancelled">已取消</option>
      </select>
      <button class="sp-btn sp-btn-danger" id="spBatchDelBtn" onclick="spBatchDelete()" disabled><i class="ti ti-trash"></i>删除</button>
      <button class="sp-btn sp-btn-ghost" id="spBatchRestoreBtn" onclick="spBatchRestore()" style="display:none" disabled><i class="ti ti-arrow-back-up"></i>恢复</button>
      <button class="sp-btn sp-btn-danger" id="spBatchPurgeBtn" onclick="spBatchPurge()" style="display:none" disabled><i class="ti ti-trash-x"></i>彻底删除</button>
    </div>

    <div id="spSubsCharts" style="display:none"></div>
    <div id="spSubsList"></div>
  </div>
</div>

<div class="sp-toast" id="spToast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="signup.js?v=20261015a"></script>
</body>
</html>
